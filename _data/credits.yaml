# Aftiteling in de footer.
# Per groep een rol en de namen. "url" en "logo" zijn optioneel. Zet "logo_is_name: true" als het logo zelf de naam toont. "logo" is optioneel: een wit (monochroom) PNG of SVG met transparante achtergrond.
# Gebruik geen Rijkslogo voor ministeries: dat is alleen voor de overheid zelf.

- role: Organisatie meetups
  credits:
    - name: Tiltshift
      url: https://www.tiltshift.nl
      logo: /assets/img/credits/tiltshift.png
    - name: ICATT
      url: https://www.icatt.nl
      logo: /assets/img/credits/icatt.svg
      logo_is_name: true   # het logo is een woordmerk: naam alleen voor schermlezers

- role: Nederlandse vertaling
  credits:
    - name: Opensourcewerken
      url: https://opensourcewerken.nl
      logo: /assets/img/credits/opensourcewerken.png
    - name: Ministerie van BZK
      url: https://www.rijksoverheid.nl/ministeries/ministerie-van-binnenlandse-zaken-en-koninkrijksrelaties
    - name: Code for NL
      url: https://www.codefor.nl
      logo: /assets/img/credits/codefornl.png

- role: Oorspronkelijke standaard
  credits:
    - name: Foundation for Public Code
      url: https://publiccode.net
      logo: /assets/img/credits/foundation-for-public-code.png
    - name: Standard for Public Code community
      url: https://www.standardforpubliccode.org
      logo: /assets/img/credits/standard-for-public-code.png
